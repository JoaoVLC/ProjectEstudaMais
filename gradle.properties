org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Evita conflitos de cache reproduzidos na recompilação com este conjunto de ferramentas.
# Em um projeto pequeno, recompilar o Kotlin inteiro é uma troca aceitável por consistência.
kotlin.incremental=false
android.nonTransitiveRClass=true
